<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../favicon.png">
  <title>Admin Dashboard | DAREDOWN</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../_astro/Layout.BHgu_56x.css">
  <link rel="stylesheet" href="../theme.css">
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
    }
    .admin-container { display: flex; min-height: 100vh; }
    .admin-sidebar {
      width: 260px;
      background: rgba(255,255,255,0.02);
      border-right: 1px solid rgba(255,255,255,0.1);
      padding: 32px 20px;
      display: flex; flex-direction: column; gap: 32px;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .admin-logo { font-size: 1.5rem; font-weight: bold; letter-spacing: -0.03em; color: #fff; text-decoration: none; }
    .admin-logo span { color: #ff4b82; font-size: 0.8rem; vertical-align: top; text-transform: uppercase; letter-spacing: 0.2em; }
    .admin-nav { display: flex; flex-direction: column; gap: 8px; }
    .admin-nav a {
      color: rgba(255,255,255,0.6); text-decoration: none;
      padding: 10px 14px; font-size: 0.85rem; letter-spacing: 0.05em;
      text-transform: uppercase; border: 1px solid transparent; transition: all 0.2s;
    }
    .admin-nav a:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .admin-nav a.active { border-color: rgba(255,255,255,0.2); color: #fff; background: rgba(255,255,255,0.03); }
    .admin-content { flex: 1; padding: 40px; overflow-y: auto; }
    .admin-header { margin-bottom: 32px; }
    .admin-title { font-size: 2rem; font-weight: 700; letter-spacing: -0.04em; margin: 0 0 8px; }
    .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); padding: 20px; }
    .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
    .stat-value { font-size: 2.2rem; font-weight: 700; color: #fff; letter-spacing: -0.05em; }
    .stat-value.danger { color: #ff4b82; }
    .table-container { overflow-x: auto; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.01); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.83rem; }
    th { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(255,255,255,0.5); font-weight: normal; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .badge { padding: 3px 7px; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 2px; white-space: nowrap; }
    .badge.success { background: rgba(46,204,113,0.1); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
    .badge.danger { background: rgba(255,75,130,0.1); color: #ff4b82; border: 1px solid rgba(255,75,130,0.3); }
    .badge.neutral { background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid rgba(255,255,255,0.1); }
    .action-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 14px; min-height: 44px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; }
    .action-btn:hover { background: #fff; color: #000; }
    .action-btn.danger:hover { background: #ff4b82; color: #fff; border-color: #ff4b82; }
    .ip-block { font-size: 0.75rem; }
    .ip-block .ip-row { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
    .ip-label { color: rgba(255,255,255,0.35); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; width: 28px; flex-shrink: 0; }
    .ip-val { color: rgba(255,255,255,0.8); font-family: monospace; font-size: 0.72rem; }
    .ip-val.localhost { color: #8bb4f7; }
    .ip-tag { color: #4f8ef7; font-size: 0.65rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: normal; margin-left: 2px; }
    .ip-val.na { color: rgba(255,255,255,0.25); font-style: italic; }
    .device-block { font-size: 0.75rem; color: #888; line-height: 1.5; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-start; z-index: 100; overflow-y: auto; padding: 40px 20px; box-sizing: border-box; }
    .modal-content { background: #111; border: 1px solid rgba(255,255,255,0.15); width: 100%; max-width: 960px; padding: 32px; position: relative; margin: auto; }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: rgba(255,255,255,0.7); font-size: 1.6rem; cursor: pointer; line-height: 1; touch-action: manipulation; }
    .modal-close:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,0.1); }
    .loading { opacity: 0.5; padding: 40px 0; text-align: center; }
    .error-msg { color: #ff4b82; padding: 20px; }

    @media (max-width: 900px) {
      .admin-container { flex-direction: column; min-height: 100vh; }
      .admin-sidebar {
        width: 100%; height: auto; position: sticky; top: 0; z-index: 50;
        padding: 12px 16px; flex-direction: row; align-items: center;
        justify-content: space-between; gap: 12px;
        background: rgba(8, 8, 10, 0.95); backdrop-filter: blur(14px);
        border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        box-sizing: border-box;
      }
      .admin-sidebar > div[style*="margin-top:auto"] { margin-top: 0 !important; }
      .admin-nav { flex-direction: row; gap: 6px; }
      .admin-nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 6px; touch-action: manipulation; }
      .admin-content { padding: clamp(14px, 3.5vw, 24px); overflow-x: hidden; }
      .overview-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
      .stat-card { padding: 14px 12px; }
      .stat-value { font-size: clamp(1.6rem, 5vw, 2.2rem); }
      .modal-overlay { padding: 14px 10px; }
      .modal-content { padding: 24px 14px; }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="admin-sidebar">
      <a href="/" class="admin-logo">DAREDOWN <span>Admin</span></a>
      <nav class="admin-nav">
        <a href="#" class="active" id="nav-overview" onclick="loadView('overview');return false;">Overview</a>
        <a href="#" id="nav-users" onclick="loadView('users');return false;">Users</a>
      </nav>
      <div style="margin-top:auto; font-size:0.7rem; color:rgba(255,255,255,0.2);">
        <a href="/api/auth/logout" onclick="doLogout(event)" style="color:rgba(255,255,255,0.3); text-decoration:none;">← Logout</a>
      </div>
    </aside>
    <main class="admin-content" id="main-content">
      <div class="loading">Checking session…</div>
    </main>
  </div>

  <div class="modal-overlay" id="user-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modal-body" class="loading">Loading…</div>
    </div>
  </div>

  <script>
    // ─── Helpers ─────────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const mainContent = $('main-content');
    let currentView = 'overview';

    // Safe display of any value — never shows "null", "undefined", or empty string
    function disp(val, fallback = 'Unknown') {
      if (val === null || val === undefined || val === '' || val === 'null' || val === 'undefined') return fallback;
      return String(val);
    }

    function formatDate(d) {
      if (!d) return '—';
      try { return new Date(d).toLocaleString(); } catch { return '—'; }
    }

    function formatDateShort(d) {
      if (!d) return '—';
      try { return new Date(d).toLocaleDateString(); } catch { return '—'; }
    }

    function formatIpValue(ip, family) {
      if (!ip || ip === 'unknown' || ip === 'Unavailable') {
        return '<span class="ip-val na" style="color:rgba(255,255,255,0.3);font-style:italic;">Unavailable</span>';
      }
      const clean = String(ip).trim();
      if (family === 'v4') {
        if (clean === '127.0.0.1' || clean.startsWith('127.0.0.1')) {
          return '<span class="ip-val localhost">127.0.0.1 <span class="ip-tag">(Localhost)</span></span>';
        }
        return `<span class="ip-val">${clean}</span>`;
      }
      if (family === 'v6') {
        if (clean === '::1' || clean.startsWith('::1')) {
          return '<span class="ip-val localhost">::1 <span class="ip-tag">(Localhost)</span></span>';
        }
        return `<span class="ip-val">${clean}</span>`;
      }
      return `<span class="ip-val">${clean}</span>`;
    }

    function renderIp(ev) {
      let ip4 = ev.ipv4 || null;
      let ip6 = ev.ipv6 || null;
      const raw = ev.ipAddress || null;

      // Backwards-compat: classify from raw ipAddress if legacy records lack ipv4/ipv6
      if (!ip4 && !ip6 && raw && raw !== 'unknown') {
        if (raw === '::1' || raw.startsWith('::1')) {
          ip6 = '::1';
        } else if (raw.startsWith('::ffff:')) {
          ip4 = raw.slice(7);
        } else if (/^\d{1,3}(\.\d{1,3}){3}$/.test(raw)) {
          ip4 = raw;
        } else if (raw.includes(':')) {
          ip6 = raw;
        }
      }

      return `<div class="ip-block">
        <div class="ip-row"><span class="ip-label">IPv4:</span> ${formatIpValue(ip4, 'v4')}</div>
        <div class="ip-row"><span class="ip-label">IPv6:</span> ${formatIpValue(ip6, 'v6')}</div>
      </div>`;
    }

    function renderDevice(ev) {
      const browser = disp(ev.browser);
      const bv = disp(ev.browserVersion);
      const os = disp(ev.os);
      const osv = disp(ev.osVersion);
      const device = disp(ev.deviceType, 'desktop');
      return `<div class="device-block">
        <div>${browser}${bv !== 'Unknown' ? ' ' + bv : ''}</div>
        <div>${os}${osv !== 'Unknown' ? ' ' + osv : ''}</div>
        <div style="color:rgba(255,255,255,0.4); font-size:0.65rem;">${device}</div>
      </div>`;
    }

    // ─── Auth ─────────────────────────────────────────────────────────────────
    async function init() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) { redirectToLogin(); return; }
        const data = await res.json();
        if (data.user?.role !== 'admin') {
          mainContent.innerHTML = '<div class="error-msg">Access denied. Admin role required.</div>';
          return;
        }
        loadView('overview');
      } catch {
        redirectToLogin();
      }
    }

    function redirectToLogin() {
      window.location.href = '/register/index.html';
    }

    async function doLogout(e) {
      e.preventDefault();
      try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
      redirectToLogin();
    }

    // ─── Navigation ───────────────────────────────────────────────────────────
    function setActiveNav(view) {
      document.querySelectorAll('.admin-nav a').forEach(a => a.classList.remove('active'));
      const el = $('nav-' + view);
      if (el) el.classList.add('active');
    }

    async function loadView(view) {
      currentView = view;
      setActiveNav(view);
      mainContent.innerHTML = '<div class="loading">Loading…</div>';
      try {
        if (view === 'overview') await renderOverview();
        if (view === 'users') await renderUsers();
      } catch (err) {
        mainContent.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
      }
    }

    // ─── Overview ─────────────────────────────────────────────────────────────
    async function renderOverview() {
      const [secRes, diagRes] = await Promise.all([
        fetch('/api/admin/security/overview', { credentials: 'include' }),
        fetch('/api/admin/diagnostics', { credentials: 'include' }).catch(() => null)
      ]);
      if (!secRes.ok) throw new Error('Failed to load overview');
      const data = await secRes.json();
      const diag = diagRes && diagRes.ok ? await diagRes.json() : null;

      let failedHtml = '';
      if (data.recentSuspicious?.length > 0) {
        failedHtml = `
          <div class="admin-header" style="margin-top:40px;"><h2 class="admin-title" style="font-size:1.4rem;">Recent Failed Logins</h2></div>
          <div class="table-container">
            <table>
              <thead><tr><th>Time</th><th>Username Attempted</th><th>IP</th><th>Reason</th><th>Browser / OS</th></tr></thead>
              <tbody>
                ${data.recentSuspicious.map(ev => `
                  <tr>
                    <td>${formatDate(ev.timestamp)}</td>
                    <td>${disp(ev.usernameAttempt, '—')}</td>
                    <td>${renderIp(ev)}</td>
                    <td><span style="color:#ff4b82; font-size:0.8rem;">${disp(ev.failureReason, 'Unknown')}</span></td>
                    <td>${renderDevice(ev)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      }

      let diagHtml = '';
      if (diag) {
        diagHtml = `
          <div class="admin-header" style="margin-top:36px;">
            <h2 class="admin-title" style="font-size:1.25rem;">Server Request &amp; IP Environment Diagnostics</h2>
          </div>
          <div style="margin-top:12px; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:0.75rem; line-height:1.6; background:#0d0d0d; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:18px;">
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:18px;">
              <div>
                <div style="color:#ff4b82; font-weight:700; margin-bottom:6px; letter-spacing:0.1em; text-transform:uppercase;">Observed Client IP</div>
                <div><strong>Detected IP:</strong> <span style="color:#fff;">${diag.detectedClientIp || 'Unavailable'}</span></div>
                <div><strong>Express req.ip:</strong> <span style="color:#fff;">${diag.expressIp || 'Unavailable'}</span></div>
                <div><strong>Socket Address:</strong> <span style="color:#fff;">${diag.remoteAddress || 'Unavailable'}</span></div>
              </div>
              <div>
                <div style="color:#ff4b82; font-weight:700; margin-bottom:6px; letter-spacing:0.1em; text-transform:uppercase;">Proxy / Vercel Headers</div>
                <div><strong>x-vercel-forwarded-for:</strong> <span style="color:#fff;">${diag.headers?.['x-vercel-forwarded-for'] || '<span style="color:rgba(255,255,255,0.35);font-style:italic;">(Not present - running local)</span>'}</span></div>
                <div><strong>x-real-ip:</strong> <span style="color:#fff;">${diag.headers?.['x-real-ip'] || '<span style="color:rgba(255,255,255,0.35);font-style:italic;">(Not present)</span>'}</span></div>
                <div><strong>x-forwarded-for:</strong> <span style="color:#fff;">${diag.headers?.['x-forwarded-for'] || '<span style="color:rgba(255,255,255,0.35);font-style:italic;">(Not present)</span>'}</span></div>
              </div>
              <div>
                <div style="color:#ff4b82; font-weight:700; margin-bottom:6px; letter-spacing:0.1em; text-transform:uppercase;">Runtime Environment</div>
                <div><strong>Platform:</strong> <span style="color:#fff;">${diag.environment?.platform || 'node'}</span></div>
                <div><strong>Vercel Detected:</strong> ${diag.environment?.isVercel ? '<span style="color:#10b981;font-weight:700;">Yes (Production)</span>' : '<span style="color:#60a5fa;">No (Localhost Dev)</span>'}</div>
                <div><strong>Node Env:</strong> <span style="color:#fff;">${diag.environment?.nodeEnv || 'development'}</span></div>
              </div>
            </div>
          </div>`;
      }

      mainContent.innerHTML = `
        <div class="admin-header"><h1 class="admin-title">Security Overview</h1></div>
        <div class="overview-grid">
          <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value">${data.totalUsers}</div></div>
          <div class="stat-card"><div class="stat-label">New Users (24h)</div><div class="stat-value">${data.newUsers24h}</div></div>
          <div class="stat-card"><div class="stat-label">Logins (24h)</div><div class="stat-value">${data.recentLogins}</div></div>
          <div class="stat-card" style="border-color:${data.failedLogins24h > 10 ? '#ff4b82' : 'rgba(255,255,255,0.1)'};">
            <div class="stat-label">Failed Logins (24h)</div>
            <div class="stat-value ${data.failedLogins24h > 10 ? 'danger' : ''}">${data.failedLogins24h}</div>
          </div>
        </div>
        ${diagHtml}
        ${failedHtml}`;
    }

    // ─── Users ────────────────────────────────────────────────────────────────
    async function renderUsers() {
      const res = await fetch('/api/admin/users', { credentials: 'include' });
      if (!res.ok) throw new Error('Failed to load users');
      const data = await res.json();

      mainContent.innerHTML = `
        <div class="admin-header">
          <h1 class="admin-title">User Management</h1>
          <div style="font-size:0.8rem; color:rgba(255,255,255,0.4);">${data.totalUsers} total · page ${data.currentPage}/${data.totalPages}</div>
        </div>
        <div class="table-container">
          <table>
            <thead><tr><th>Username</th><th>Provider</th><th>Role</th><th>Status</th><th>Tournament</th><th>Joined</th><th>Last Login</th><th>Actions</th></tr></thead>
            <tbody>
              ${data.users.map(u => `
                <tr>
                  <td>
                    <div style="font-weight:600;">${u.username}</div>
                    <div style="font-size:0.7rem; color:#666;">${u.email || 'No email'}</div>
                  </td>
                  <td><span class="badge neutral">${u.authProvider}</span></td>
                  <td><span class="badge ${u.role === 'admin' ? 'danger' : 'neutral'}">${u.role}</span></td>
                  <td><span class="badge ${u.accountStatus === 'active' ? 'success' : 'danger'}">${u.accountStatus}</span></td>
                  <td><span class="badge neutral">${u.tournamentStatus || 'registered'}</span></td>
                  <td>${formatDateShort(u.createdAt)}</td>
                  <td>${u.lastLoginAt ? formatDateShort(u.lastLoginAt) : '—'}</td>
                  <td><button class="action-btn" onclick="openUserModal('${u._id}')">Details</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    // ─── User Detail Modal ─────────────────────────────────────────────────────
    async function openUserModal(id) {
      $('user-modal').style.display = 'flex';
      $('modal-body').innerHTML = '<div class="loading">Loading…</div>';

      try {
        const [userRes, evRes] = await Promise.all([
          fetch(`/api/admin/users/${id}`, { credentials: 'include' }),
          fetch(`/api/admin/users/${id}/security-events?limit=20`, { credentials: 'include' })
        ]);
        const user = await userRes.json();
        const evData = await evRes.json();

        $('modal-body').innerHTML = `
          <h2 class="admin-title" style="font-size:1.6rem; margin-bottom:24px;">${user.username}</h2>

          <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:20px; margin-bottom:32px; font-size:0.85rem;">
            <div><div class="stat-label">Email</div><div>${disp(user.email, 'None')}</div></div>
            <div><div class="stat-label">Provider</div><div>${user.authProvider}</div></div>
            <div><div class="stat-label">Role</div><div>${user.role}</div></div>
            <div><div class="stat-label">Status</div><span class="badge ${user.accountStatus === 'active' ? 'success' : 'danger'}">${user.accountStatus}</span></div>
            <div><div class="stat-label">Tournament</div><div>${disp(user.tournamentStatus)}</div></div>
            <div><div class="stat-label">Joined</div><div>${formatDate(user.createdAt)}</div></div>
            <div><div class="stat-label">Last Login</div><div>${formatDate(user.lastLoginAt)}</div></div>
            <div>
              <div class="stat-label">Action</div>
              ${user.role !== 'admin' ? `<button class="action-btn ${user.accountStatus === 'active' ? 'danger' : ''}"
                onclick="toggleUserStatus('${user._id}','${user.accountStatus === 'active' ? 'suspended' : 'active'}')">
                ${user.accountStatus === 'active' ? 'Suspend' : 'Restore'}
              </button>` : '<span style="color:#666;font-size:0.75rem;">Protected</span>'}
            </div>
          </div>

          <h3 class="admin-title" style="font-size:1.2rem; margin-bottom:16px;">Security Activity (${evData.totalEvents} total)</h3>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Time</th><th>Event</th><th>Result</th>
                  <th>IPv4</th><th>IPv6</th>
                  <th>Browser</th><th>OS</th><th>Device</th>
                  <th>Provider</th><th>Reason</th>
                </tr>
              </thead>
              <tbody>
                ${evData.events.map(ev => {
                  let ip4 = ev.ipv4 || null;
                  let ip6 = ev.ipv6 || null;
                  const raw = ev.ipAddress || null;
                  if (!ip4 && !ip6 && raw && raw !== 'unknown') {
                    if (raw === '::1' || raw.startsWith('::1')) {
                      ip6 = '::1';
                    } else if (raw.startsWith('::ffff:')) {
                      ip4 = raw.slice(7);
                    } else if (/^\d{1,3}(\.\d{1,3}){3}/.test(raw)) {
                      ip4 = raw;
                    } else if (raw.includes(':')) {
                      ip6 = raw;
                    }
                  }
                  return `<tr>
                    <td style="white-space:nowrap; font-size:0.75rem;">${formatDate(ev.timestamp)}</td>
                    <td><span class="badge neutral">${ev.eventType}</span></td>
                    <td><span class="badge ${ev.success ? 'success' : 'danger'}">${ev.success ? 'OK' : 'Fail'}</span></td>
                    <td style="font-family:monospace; font-size:0.72rem;">${formatIpValue(ip4, 'v4')}</td>
                    <td style="font-family:monospace; font-size:0.72rem;">${formatIpValue(ip6, 'v6')}</td>
                    <td style="font-size:0.75rem;">${disp(ev.browser)}${disp(ev.browserVersion) !== 'Unknown' ? ' ' + disp(ev.browserVersion,'') : ''}</td>
                    <td style="font-size:0.75rem;">${disp(ev.os)}${disp(ev.osVersion) !== 'Unknown' ? ' ' + disp(ev.osVersion,'') : ''}</td>
                    <td style="font-size:0.75rem;">${disp(ev.deviceType, 'desktop')}</td>
                    <td><span class="badge neutral">${disp(ev.authProvider)}</span></td>
                    <td style="font-size:0.72rem; color:#ff4b82;">${ev.success ? '' : disp(ev.failureReason, '—')}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        $('modal-body').innerHTML = `<div class="error-msg">Error loading user: ${err.message}</div>`;
      }
    }

    function closeModal() {
      $('user-modal').style.display = 'none';
    }
    // Close modal on backdrop click
    $('user-modal').addEventListener('click', e => { if (e.target === $('user-modal')) closeModal(); });

    async function toggleUserStatus(id, newStatus) {
      if (!confirm(`Set account status to "${newStatus}"?`)) return;
      try {
        const res = await fetch(`/api/admin/users/${id}/status`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) { openUserModal(id); if (currentView === 'users') loadView('users'); }
        else { const d = await res.json(); alert(d.error); }
      } catch { alert('Failed to update status.'); }
    }

    init();
  </script>
</body>
</html>
